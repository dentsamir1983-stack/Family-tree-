<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة عيلة يوسف حسن سليمان</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="تطبيق خاص بعيلة يوسف حسن سليمان">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شجرة العيلة">
<script>try{var t=localStorage.getItem('ft-theme')||'auto';if(t==='light'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.classList.add('light')}catch(e){}</script>
<meta name="theme-color" content="#0b1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Night-garden theme from v2: dark, glass cards, one color per family branch. Top bar with tabs (الشجرة / الأعمار / القرابة); panels slide from the left (bottom sheet on phones). */
:root{
  --bg:#080d12; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --panel:#0f1820;
  --stroke:rgba(255,255,255,.11); --ink:#eaf1f4; --muted:#8b9ba6; --accent:#f4b94e; --brand:#3ecfb2;
  --male:#5aa9ff; --female:#f27fb2; --alive:#4ade80; --dead:#d9c38c;
  --font:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}.fileX{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}#kidrow{flex-wrap:wrap}#kidrow .btn{flex:1 1 40%;justify-content:center}#kidrow input{flex:1 1 55%}#kidTtl{flex:0 0 auto;max-width:110px;padding:10px 6px;border-radius:12px;background:#0b141b;color:inherit;border:1px solid #ffffff22;font:inherit;font-size:14px}.nick{font-size:.82em;font-weight:600;color:#f4c56a;margin-inline-start:4px;white-space:nowrap}.bpick{display:grid;grid-template-columns:1fr 1.4fr 1.5fr;gap:8px}.bpick select{width:100%;min-width:0;padding:11px 8px;border-radius:12px;background:#0b141b;color:inherit;border:1px solid #ffffff22;font:inherit;font-size:15px}.whopic{display:block;width:150px;height:150px;object-fit:cover;border-radius:18px;margin:6px auto 10px;border:3px solid var(--br,#f4b94e);box-shadow:0 8px 24px #0008}
*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.sheet{background:#0f1820!important}
.card{background:linear-gradient(180deg,#18232c,#121b23)!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(62,207,178,.12),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(244,185,78,.10),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
select option{background:#111a22;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--stroke);background:var(--glass2);backdrop-filter:blur(10px);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#04110e;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:#ff8a7a;border-color:rgba(255,122,107,.35)}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.6}

/* top bar */
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(8,13,18,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke);z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#1b7f6c);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap}
.brand p{margin:0;font-size:11.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--alive);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.live.off i{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.2)}
.tabs{display:flex;gap:4px;background:var(--glass);padding:4px;border-radius:14px;border:1px solid var(--stroke)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-inline-start:auto}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{background:var(--glass);border:1px solid var(--stroke);border-radius:10px;padding:7px 10px;max-width:160px;font-size:14px}

/* views */
main{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tree floating bits */
.search{position:absolute;top:14px;right:14px;z-index:12}
.search input{width:240px;background:var(--glass2);border:1px solid var(--stroke);backdrop-filter:blur(10px);border-radius:12px;padding:9px 12px;font-size:14px}
.results{position:absolute;top:calc(100% + 6px);inset-inline:0;min-width:260px;background:#111a22;border:1px solid var(--stroke);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.5);list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;display:none;z-index:30}
.results.open{display:block}
.results li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.results li:hover,.results li.hl{background:var(--glass2)}
.results small{color:var(--muted);margin-inline-start:auto;font-size:12px}
.insights{position:absolute;top:14px;left:14px;z-index:11;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 300px)}
.ins{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:8px 12px;backdrop-filter:blur(10px);cursor:pointer;text-align:start}
.ins b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ins span{font-size:11px;color:var(--muted)}
.guide{position:absolute;top:70px;right:14px;z-index:11;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;max-width:min(560px,calc(100% - 28px));padding:9px 12px;font-size:12.5px;color:var(--muted);background:rgba(15,24,32,.8);backdrop-filter:blur(10px);border:1px solid var(--stroke);border-radius:14px}
.guide b{color:var(--ink);font-weight:600}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%}
.guide .close{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;text-decoration:underline}

.canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px}
.canvas.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.anim{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.links path{fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.6;transition:opacity .25s,stroke-width .25s}
.links path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.links path.wed{stroke:var(--accent);stroke-dasharray:3 6;opacity:.85}
.links path.hot{opacity:1;stroke-width:4}
.links path.cold{opacity:.1}
.genlbl{position:absolute;right:20px;font-size:12px;color:var(--muted);white-space:nowrap;padding:3px 10px;border:1px solid var(--stroke);border-radius:999px;background:rgba(8,13,18,.6)}
.heart{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#14202a;border:1.5px solid var(--accent);display:grid;place-items:center}
.heart svg{width:13px;height:13px}

.node{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch)}
.card{position:relative;width:100%;height:100%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid var(--stroke);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;padding:13px 8px 10px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s,opacity .25s}
.card:hover{transform:translateY(-4px);border-color:var(--br);box-shadow:0 14px 30px -10px var(--br)}
.node.sel .card{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 18px 40px -12px var(--accent)}
.node.path .card{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 18px 40px -14px var(--accent)}
.node.me .card{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.node.me .card::after{content:"ده أنا";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand);color:#04110e;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px}
.node.dim .card{opacity:.25}
.av{width:64px;height:64px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(var(--br,var(--male)),color-mix(in srgb,var(--br,var(--male)) 30%,transparent),var(--br,var(--male)));position:relative;display:block}
.av>span{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#15202a;display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--br,var(--male))}
.av img{width:100%;height:100%;object-fit:cover}
.av i{position:absolute;bottom:0;left:0;width:17px;height:17px;border-radius:50%;border:3px solid #101820;background:var(--male)}
.f .av i,.av.f i{background:var(--female)}
.dead .av img,.av.dead img{filter:grayscale(1) contrast(1.05)}
.dead .av>span{color:var(--muted)}
.nm{margin-top:9px;font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:center;justify-content:center;gap:5px;text-wrap:balance}
.ci{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#c5d2d9;margin-top:4px;max-width:100%;min-width:0;text-decoration:none;border-radius:6px;padding:1px 4px}
a.ci:hover{background:var(--glass2);color:var(--ink)}
.ci svg{width:13px;height:13px;flex:none;color:var(--br,var(--brand))}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.ph span{direction:ltr;font-variant-numeric:tabular-nums}
.nm svg{width:14px;height:14px;flex:none;color:var(--br,var(--brand))}
.contact{margin-top:16px;display:flex;flex-direction:column;gap:8px;text-align:start}
.crow{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px}
.crow .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--br,var(--brand)) 18%,transparent);color:var(--br,var(--brand));flex:none}
.crow .ic svg{width:18px;height:18px}
.crow div{flex:1;min-width:0}
.crow small{display:block;font-size:11px;color:var(--muted)}
.crow b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.crow b.ltr{direction:ltr;display:inline-block}
.crow .acts{display:flex;gap:6px;flex:none}
.crow .acts a{font-size:12.5px;padding:6px 10px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass2);text-decoration:none;color:var(--ink);white-space:nowrap}
.crow .acts a:hover{border-color:var(--accent)}
.of{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:var(--glass2);color:var(--muted)}
.pill.alive{color:#a7f3c6}
.pill.alive::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alive);flex:none;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}100%{box-shadow:0 0 0 7px transparent}}
.pill.dead{color:var(--dead)}
.pill.kin{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:600;font-size:11.5px}
.tog{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);height:28px;min-width:30px;padding:0 9px;border-radius:999px;border:1px solid var(--stroke);background:#14202a;font-size:12px;font-weight:700;cursor:pointer;z-index:2;font-variant-numeric:tabular-nums}
.tog:hover{border-color:var(--br);color:var(--br)}

.fab{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;z-index:12}
.zoom{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;z-index:12;display:flex;gap:6px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);z-index:5}

/* timeline */
#vTime{overflow:auto;padding:22px 22px 40px}
.tl-head{max-width:1100px;margin:0 auto 22px}
.tl-head h2{margin:0;font-size:22px;font-weight:600}
.tl-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tl{max-width:1100px;margin:0 auto}
.tl-axis{position:sticky;top:-22px;z-index:2;height:34px;background:var(--bg);border-bottom:1px solid var(--stroke);margin-inline-start:180px}
.tl-axis span{position:absolute;top:8px;font-size:11.5px;color:var(--muted);transform:translateX(50%);font-variant-numeric:tabular-nums}
.tl-row{display:flex;align-items:center;height:46px;cursor:pointer;border-radius:10px}
.tl-row:hover{background:var(--glass)}
.tl-name{width:180px;flex:none;display:flex;align-items:center;gap:8px;font-size:13.5px;padding-inline-start:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-name .av{width:32px;height:32px;padding:2px}.tl-name .av>span{font-size:12px}.tl-name .av i{display:none}
.tl-track{position:relative;flex:1;height:100%}
.tl-grid{position:absolute;top:0;bottom:0;border-inline-start:1px dashed rgba(255,255,255,.06)}
.tl-bar{position:absolute;top:15px;height:16px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--br) 35%,transparent),var(--br));transform-origin:right;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.tl-bar.dead{background:linear-gradient(90deg,rgba(217,195,140,.25),rgba(217,195,140,.6))}
.tl-bar em{position:absolute;inset-inline-start:calc(100% + 8px);top:-1px;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tl-now{position:absolute;top:0;bottom:0;border-inline-start:2px solid var(--accent);opacity:.6}
.missing{max-width:1100px;margin:26px auto 0;padding:16px;border:1px dashed var(--stroke);border-radius:16px}
.missing h3{margin:0 0 4px;font-size:15px;font-weight:600}
.missing p{margin:0 0 12px;color:var(--muted);font-size:13px}

/* kinship view */
#vKin{overflow:auto;padding:28px 18px 60px}
.kin{max-width:860px;margin:0 auto}
.kin h2{font-size:26px;font-weight:600;margin:0 0 6px}
.kin>p{color:var(--muted);margin:0 0 22px;font-size:14px}
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.picker{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}
.picker .av{width:54px;height:54px}
.picker label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.picker select{width:100%;background:transparent;border:0;font-size:16px;font-weight:600;padding:0;cursor:pointer}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass2);cursor:pointer;display:grid;place-items:center}
.answer{margin-top:22px;padding:24px;border-radius:22px;background:linear-gradient(135deg,rgba(62,207,178,.14),rgba(244,185,78,.10));border:1px solid var(--stroke);text-align:center}
.answer .big{font-size:clamp(21px,3.6vw,32px);font-weight:700;line-height:1.5;text-wrap:balance}
.answer .big mark{background:none;color:var(--accent)}
.answer .sub{color:var(--muted);margin-top:8px;font-size:14px;line-height:1.6}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:8px 4px;margin-top:22px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;animation:pop .45s both}
.step .av{width:50px;height:50px}
.step span.n{font-size:12.5px;line-height:1.3;text-align:center}
.step small{font-size:11px;color:var(--muted);text-align:center}
.step.top .av{box-shadow:0 0 0 4px rgba(244,185,78,.25)}
.arrow{color:var(--muted);font-size:18px;margin-top:14px;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.kact{display:flex;justify-content:center;margin-top:20px}
.examples{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipx{background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chipx:hover{border-color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;top:12px;bottom:12px;left:12px;width:min(420px,calc(100% - 24px));background:rgba(14,22,30,.92);backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.5);transform:translateX(calc(-100% - 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--stroke)}
.sh-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;display:grid;place-items:center;flex:none}
.sh-body{flex:1;overflow:auto;padding:16px}
.sh-foot{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--stroke);flex-wrap:wrap}
.sh-foot .btn{flex:1;justify-content:center}

/* profile */
.prof{text-align:center;margin:-16px -16px 0;padding:22px 16px 4px;background:radial-gradient(260px 160px at 50% 0%,color-mix(in srgb,var(--br,var(--brand)) 32%,transparent),transparent 70%)}
.prof .av{width:112px;height:112px;margin:0 auto}.prof .av>span{font-size:42px}.prof .av i{width:22px;height:22px}
.prof h3{margin:12px 0 2px;font-size:22px;font-weight:600}
.prof .nas{color:var(--muted);font-size:13px}
.kinbig{margin:14px 0 0;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:15px}
.kinbig b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:16px;text-align:start}
.fact{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:9px 11px}
.fact span{display:block;font-size:11px;color:var(--muted)}
.fact b{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.bio{margin-top:12px;text-align:start;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.grp{margin-top:16px;text-align:start}
.grp h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:500}
.people{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--stroke);background:var(--glass);border-radius:999px;padding:3px 11px 3px 3px;cursor:pointer;font-size:13px}

.bdbar{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:25;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,rgba(242,127,178,.25),rgba(244,185,78,.2));border:1px solid rgba(244,185,78,.45);backdrop-filter:blur(12px);box-shadow:0 14px 30px rgba(0,0,0,.4);animation:fade .4s ease}
.bdi{font-size:28px}.bdt{flex:1;min-width:0;cursor:pointer}.bdt b{display:block;font-size:14px}.bdt span{font-size:12.5px;color:#f3e3c0}
.pcard .phero{text-align:center;padding:26px 20px 10px}
.pico{font-size:54px;filter:drop-shadow(0 8px 18px rgba(244,185,78,.35));animation:float 3s ease-in-out infinite}

.pfoot{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px 20px}.pfoot .btn{flex:1;justify-content:center}
.famcount{display:inline-block;vertical-align:middle;margin-inline-start:8px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#ffe08a,#f4b94e);color:#1a1205;white-space:nowrap}
.wintro{margin:2px 18px 0;text-align:center;font-size:16px;color:#f3e3c0;font-weight:600}
.wgrid{display:grid;gap:12px;padding:10px 18px}
.wcard{text-align:center;padding:18px 14px;border-radius:20px;border:1px solid var(--stroke);cursor:pointer}

.wcard.dead{background:linear-gradient(160deg,rgba(217,195,140,.16),rgba(255,255,255,.03))}
.wlbl{font-size:12.5px;color:var(--muted);margin-bottom:8px}

.fact-big{margin:6px 18px;padding:22px 18px;border-radius:20px;background:linear-gradient(160deg,rgba(90,169,255,.15),rgba(244,185,78,.08));border:1px solid var(--stroke);font-size:19px;line-height:1.9;text-align:center}
.bdm{padding:6px 18px}.bdm.now .awlbl{color:#f27fb2}
.bdrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);margin-bottom:6px;cursor:pointer}

.cearea{width:100%;border:1px solid var(--stroke);border-radius:12px;padding:10px 12px;background:var(--glass);font-size:14px;line-height:1.8;resize:vertical}
.tellad{margin-top:18px;padding:14px;border-radius:16px;border:1px dashed rgba(244,185,78,.5);background:rgba(244,185,78,.06);display:flex;flex-direction:column;gap:8px;text-align:start}
.tellad b{font-size:14px;color:#ffe7a3}.tellad span{font-size:12.5px;color:var(--muted);line-height:1.6}
.tellad textarea{border:1px solid var(--stroke);border-radius:11px;padding:9px 11px;background:var(--glass);font-size:14px;resize:vertical}
@media (max-width:860px){.dock{left:4px;padding:4px;gap:2px}.dock button{width:50px;font-size:9.5px}.dock button span{font-size:18px}.bdbar{top:118px}}
.award{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.65);overflow:auto;padding:18px 12px;animation:fade .3s ease}
.awcard{position:relative;max-width:560px;margin:0 auto;background:#0d141b;border:1px solid rgba(244,185,78,.35);border-radius:28px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(244,185,78,.08) inset}
.awhero{position:relative;text-align:center;padding:34px 20px 26px;background:radial-gradient(420px 220px at 50% 20%,rgba(244,185,78,.35),transparent 70%),linear-gradient(180deg,#1a1408,#0d141b);overflow:hidden}
.awcard>.whox{z-index:6}
.whob a.btn{text-decoration:none;justify-content:center;flex:1}
.rays{pointer-events:none;position:absolute;left:50%;top:70px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(244,185,78,.13) 0 6deg,transparent 6deg 18deg);border-radius:50%;animation:spin 40s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes spin{to{transform:rotate(360deg)}}
.trophy{position:relative;font-size:76px;line-height:1;filter:drop-shadow(0 10px 25px rgba(244,185,78,.6));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.awkicker{position:relative;margin-top:10px;font-size:12px;letter-spacing:3px;color:#f4d58e}
.awhero h2{position:relative;margin:4px 0 6px;font-size:38px;font-weight:700;background:linear-gradient(90deg,#b8801e,#ffe7a3,#f4b94e,#ffe7a3,#b8801e);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.awhero p{position:relative;margin:0;color:#d8c9a3;font-size:14px}
.awsec{padding:18px 18px 4px;border-top:1px solid rgba(244,185,78,.12)}
.awsec:last-child{padding-bottom:20px}
.awlbl{font-size:13px;font-weight:700;color:#f4b94e;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.awlbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(244,185,78,.35),transparent)}
.awme select,.awadmin select,.awadmin input{width:100%;border:1px solid var(--stroke);border-radius:12px;padding:10px 12px;background:var(--glass);font-size:14px}
.mypts{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px}
.mypts .num{font-size:46px;font-weight:700;color:#ffe7a3;font-variant-numeric:tabular-nums;line-height:1}
.lvl{margin-inline-start:auto;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--lc);color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent)}
.lvbar{height:10px;border-radius:999px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b8801e,#ffe08a);box-shadow:0 0 12px rgba(244,185,78,.6)}
.awsmall{font-size:12.5px;color:var(--muted);margin-top:8px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);cursor:pointer}
.board li.top{border-color:rgba(244,185,78,.45);background:linear-gradient(90deg,rgba(244,185,78,.14),transparent)}
.board .md{width:26px;text-align:center;font-size:18px}.board .md b{font-size:14px;color:var(--muted)}
.board .av{width:34px;height:34px;padding:2px}.board .av>span{font-size:13px}.board .av i{display:none}
.board .bn{flex:1;font-size:14.5px}.board .bp{font-weight:700;color:#ffe7a3;font-variant-numeric:tabular-nums}
.awadmin{display:grid;grid-template-columns:1fr 70px auto;gap:8px;margin-top:10px}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ways div{position:relative;padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke)}
.ways .pt{display:inline-block;font-size:18px;font-weight:700;color:#1a1205;background:linear-gradient(180deg,#ffe08a,#f4b94e);border-radius:10px;padding:2px 10px;margin-bottom:6px}
.ways b{display:block;font-size:14px}.ways small{font-size:12px;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.lvls div{padding:10px 4px;border-radius:16px;border:1px solid color-mix(in srgb,var(--lc) 40%,transparent);background:color-mix(in srgb,var(--lc) 8%,transparent)}
.lvls span{display:block;font-size:26px}.lvls b{display:block;font-size:13px;color:var(--lc)}.lvls small{font-size:11px;color:var(--muted)}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.75;color:#d7e0e5}
.rules b{color:#ffe7a3}
.awf label{color:#f4b94e}
@media (max-width:420px){.ways{grid-template-columns:1fr}.lvls{grid-template-columns:repeat(2,1fr)}.awhero h2{font-size:32px}}
.whonext{margin-top:12px;border:0;background:none;color:var(--brand);cursor:pointer;font-size:13.5px}
.whox{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;color:var(--muted)}
.grp .hint{font-size:12.5px;color:var(--muted)}
.node.ref .card{border-style:dashed;background:rgba(255,255,255,.03)}
.node.ref .av{opacity:.75}
.refnote{margin-top:auto;font-size:12px;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);padding:3px 10px;border-radius:999px}
.addq{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--stroke);background:#14202a;color:var(--brand);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:3;opacity:.75;transition:opacity .15s,transform .15s}
.delq{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--stroke);background:#14202a;color:#ff8a7a;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:3;opacity:.75;transition:opacity .15s,transform .15s}
.node:hover .delq{opacity:1}.delq:hover{transform:scale(1.12);border-color:#ff8a7a}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:8px 10px}
.rrow .av{width:40px;height:40px;padding:2px}.rrow .av>span{font-size:15px}.rrow .av i{display:none}
.rrow div{flex:1;min-width:0}.rrow b{display:block;font-size:14.5px}.rrow small{color:var(--accent);font-size:12px}
.rrow button{border:1px solid rgba(255,122,107,.35);background:transparent;color:#ff8a7a;border-radius:10px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.rrow button:hover{background:rgba(255,122,107,.12)}
.node:hover .addq{opacity:1}.addq:hover{transform:scale(1.12);border-color:var(--brand)}
.amenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amenu button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;font-size:14px}
.amenu button:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.amenu button span{font-size:22px;line-height:1}
.amenu button small{font-size:11.5px;color:var(--muted)}
.amenu .wide{grid-column:1/-1;flex-direction:row;justify-content:center}
.qadd{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px;align-items:end;padding:10px;border-radius:14px;border:1px dashed var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.qadd input{border:1px solid var(--stroke);border-radius:10px;padding:9px 10px;background:var(--glass);font-size:14px;width:100%}
.qadd label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
.qadd .t{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--brand)}
@media (max-width:860px){.qadd{grid-template-columns:1fr 1fr}.qadd .btn{justify-content:center}}
.addrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.addrow .btn{justify-content:center;font-size:13px}
.idl{margin-top:16px;font-size:11px;color:var(--muted);direction:ltr;text-align:right}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--stroke);border-radius:11px;padding:10px 12px;background:var(--glass);font-size:15px;width:100%}
.field input::placeholder,.field textarea::placeholder{color:#5f707b}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.seg{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass2);font-weight:600;color:var(--ink)}
.seg button[data-v="male"][aria-pressed="true"]{color:var(--male)}
.seg button[data-v="female"][aria-pressed="true"]{color:var(--female)}
.seg button[data-v="alive"][aria-pressed="true"]{color:var(--alive)}
.seg button[data-v="dead"][aria-pressed="true"]{color:var(--dead)}
.photoin{display:flex;align-items:center;gap:14px;flex-direction:column}
.photoin .av{width:84px;height:84px}.photoin .av>span{font-size:30px}
.photoin>div{display:flex;gap:8px}
.sect{grid-column:1/-1;margin:8px 0 -2px;font-size:13px;font-weight:600;color:var(--brand);display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--stroke)}
.note{grid-column:1/-1;font-size:12px;color:var(--muted);background:var(--glass);border-radius:10px;padding:8px 10px;line-height:1.6}
.err{color:#ff8a7a;font-size:13px;min-height:18px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:14px;text-align:start}
.stp{display:flex;align-items:center;gap:10px;background:var(--glass);border-radius:12px;padding:6px 10px;font-size:14px}
.stp small{color:var(--muted);margin-inline-start:auto;font-size:12px;text-align:end}

.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;background:#eaf1f4;color:#0b1117;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .bar{padding:8px 12px;gap:8px}
  .brand p{display:none}
  .tools{width:100%;margin:0}
  .tabs{flex:1}.tabs button{flex:1;justify-content:center;padding:7px 6px;font-size:12.5px}
  .me{width:100%;justify-content:space-between}.me select{max-width:none;flex:1}
  .insights{display:none}
  .search{left:12px;right:12px;top:10px}.search input{width:100%}
  .guide{top:58px;right:12px;left:12px;font-size:11.5px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88%;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .fgrid{grid-template-columns:1fr}
  .zoom .hide-s{display:none}
  .pickers{grid-template-columns:1fr}.swap{margin:0 auto;transform:rotate(90deg)}
  .tl-name{width:120px}.tl-axis{margin-inline-start:120px}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}

.ro .addq,.ro .delq,.ro #addBtn,.ro [data-edit],.ro .addl,.ro .addrow,.ro .kidbtn,.ro [data-sp]{display:none!important}
/* ===== gate (login / waiting) ===== */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;overflow:auto;
  background:radial-gradient(700px 420px at 50% 0%,rgba(62,207,178,.18),transparent 70%),radial-gradient(600px 400px at 50% 110%,rgba(244,185,78,.16),transparent 70%),var(--bg)}
.gcard{width:min(400px,100%);text-align:center;padding:26px 20px 18px;border-radius:26px;background:var(--panel);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:fade .35s ease}
.glogo{font-size:54px;line-height:1;filter:drop-shadow(0 8px 18px rgba(62,207,178,.35))}
.gcard h1{font-size:21px;margin:10px 0 4px;color:var(--ink)}
.gsub{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.gmsg{margin:14px 0 18px;font-size:15.5px;line-height:1.9;color:var(--ink)}
.gwait{font-size:46px;margin-top:12px;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.gform{display:flex;flex-direction:column;gap:12px;text-align:start}
.gform label,.wform label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:600}
.gform input,.wform input,.wform select,.wform textarea,.urow select,.admtabs+div select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--stroke);border-radius:13px;padding:12px 13px;min-width:0}
.gform input:focus,.wform :is(input,select,textarea):focus{outline:2px solid var(--brand);outline-offset:1px}
.gerr{min-height:20px;margin:0;color:#ff8a7a;font-size:13.5px;text-align:center}
.btn.big{width:100%;justify-content:center;padding:13px;font-size:16px;margin-top:4px}
.gcard>.btn.big+.btn.big{margin-top:10px}
.glinks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.glinks button{background:none;border:none;color:var(--brand);font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;text-decoration:underline;text-underline-offset:4px}

/* ===== account / admin / panels ===== */
.menubtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;margin-inline-start:auto;position:relative}

/* ================= kinship (Egyptian) ================= */
function up(id){const prev={[id]:null},dist={[id]:0},q=[id];while(q.length){const x=q.shift();parents(x).forEach(p=>{if(!(p in dist)){dist[p]=dist[x]+1;prev[p]=x;q.push(p)}})}return{prev,dist}}
const pathTo=(prev,from,to)=>{const p=[to];let c=to;while(c!==from){c=prev[c];p.unshift(c)}return p}; // from..to
const g=(id,m,f)=>F(id)?f:m;
// chain of nouns describing X in relation to Y ("X يبقى [nouns] Y")
function bloodChain(xp,yp){
  const a=xp.length-1,b=yp.length-1,out=[];
  if(a===0){ // X is ancestor
    if(b===1)return[g(xp[0],'أبو','أم')];
    out.push(g(xp[0],'جد','جدة'));for(let i=b-2;i>=1;i--)out.push(g(yp[i],'أبو','أم'));return out;
  }
  if(b===0){ // X is descendant
    if(a===1)return[g(xp[0],'ابن','بنت')];
    for(let i=0;i<a-2;i++)out.push(g(xp[i],'ابن','بنت'));out.push(g(xp[a-2],'حفيد','حفيدة'));return out;
  }
  for(let i=0;i<a-1;i++)out.push(g(xp[i],'ابن','بنت'));
  const xs=xp[a-1],ys=yp[b-1];
  if(b===1){out.push(g(xs,'أخو','أخت'));return out}
  out.push(F(ys)?g(xs,'خال','خالة'):g(xs,'عم','عمة'));
  for(let i=b-2;i>=1;i--)out.push(g(yp[i],'أبو','أم'));
  return out;
}
function bloodKin(x,y){
  const A=up(x),B=up(y);let best=null;
  for(const c in A.dist)if(c in B.dist){const s=A.dist[c]+B.dist[c];if(!best||s<best.s||(s===best.s&&!F(c)&&F(best.c)))best={c,s}}
  if(!best)return null;
  const xp=pathTo(A.prev,x,best.c),yp=pathTo(B.prev,y,best.c);
  return{chain:bloodChain(xp,yp),path:[...xp,...yp.slice(0,-1).reverse()],top:best.c};
}
function kin(x,y){
  if(!x||!y||!byId[x]||!byId[y])return null;
  if(x===y)return{chain:[],path:[x],self:true};
  if(spouses(x).includes(y))return{chain:[g(x,'جوز','مرات')],path:[x,y]};
  let r=bloodKin(x,y);if(r)return r;
  for(const s of spouses(x)){const k=bloodKin(s,y);if(k)return{chain:[g(x,'جوز','مرات'),...k.chain],path:[x,...k.path],top:k.top}}
  for(const t of spouses(y)){const k=bloodKin(x,t);if(k)return{chain:[...k.chain,g(t,'جوز','مرات')],path:[...k.path,y],top:k.top}}
  for(const s of spouses(x))for(const t of spouses(y)){const k=bloodKin(s,t);if(k)return{chain:[g(x,'جوز','مرات'),...k.chain,g(t,'جوز','مرات')],path:[x,...k.path,y],top:k.top}}
  return{chain:null,path:[]};
}

const CW=184,CH=196,CG=44,SG=30,RG=104,PX=130,PY=64;

function buildUnits(){
  U={};const used=new Set();
  function build(id,depth,branch){
    used.add(id);
    const ss=spouses(id).filter(s=>!used.has(s));ss.forEach(s=>used.add(s));
    const u={id,ss,depth,branch,kids:[]};
    kidsOf(id).sort(order).forEach(k=>{
      if(!used.has(k))u.kids.push(build(k,depth+1,depth===1?k:branch));
      else if(!ss.includes(k)&&k!==id&&pids(byId[k]).some(p=>p===id||ss.includes(p)))u.kids.push({id:'ref:'+k+':'+id,ref:k,ss:[],depth:depth+1,branch:depth===1?k:branch,kids:[]});
    });
    return u;
  }
  roots=MEMBERS.filter(m=>!blood(m.id)&&!spouses(m.id).some(blood)).map(m=>m.id).sort(order);
  // biggest family first
  const size=id=>{let n=0;const s=[id],seen=new Set;while(s.length){const x=s.pop();if(seen.has(x))continue;seen.add(x);n++;kidsOf(x).forEach(k=>s.push(k))}return n};
  roots.sort((a,b)=>size(b)-size(a));
  forest=[];
  roots.forEach(r=>{if(!used.has(r))forest.push(build(r,0,null))});
  MEMBERS.forEach(m=>{if(!used.has(m.id))forest.push(build(m.id,0,null))});
  BR=[...new Set(Object.values(U).length?[]:[])];
  const walk=(u,p)=>{U[u.id]=u;u.parent=p;u.ss.forEach(s=>U[s]=u);u.kids.forEach(k=>walk(k,u))};forest.forEach(u=>walk(u,null));
  BR=[];Object.values(U).forEach(u=>{if(u.branch&&!BR.includes(u.branch))BR.push(u.branch)});
}

function place(u,right){
  const y=PY+u.depth*(CH+RG),cx=right-u.w/2;let x=cx+ownW(u)/2-CW;
  pos[u.id]={x,y};maxD=Math.max(maxD,u.depth);
  u.ss.forEach(s=>{x-=CW+CG;pos[s]={x,y}});
  if(!collapsed.has(u.id)){let r=cx+u.kw/2;u.kids.forEach(k=>{place(k,r);r-=k.w+SG})}
}

function bdOf(m){const s=arNum(String(m.bday||'')).trim()||'';let d,mo;

function relName(id,r){ // how r is related to id, Egyptian

function canUnlink(id,r){

function renderTime(){

   ${dated.map((m,i)=>{const b=yr(m.birth),d=isDead(m)?yr(m.death):null,e=d??(isDead(m)?b+1:NOW),a=showAge(m);return `<div class="tl-row" data-go="${m.id}" style="--br:${colorOf(m.id)}"><div class="tl-name">${avatar(m.id)}${esc(m.name)}</div>

  if(!usersUnsub){const {fs,fdb}=FB;usersUnsub=fs.onSnapshot(fs.collection(fdb,'users'),s=>{USERS=s.docs.map(d=>({...d.data(),id:d.id}));paint()},e=>{const b=$('#admBody');if(b)b.innerHTML=`<p class="awsmall">${fbErr(e)}</p>`})}else paint();
}
async function setRole(uid,role){
  if(window.__DEMO){const u=USERS.find(x=>x.id===uid);if(u)u.role=role;admUsers();toast('اتحفظ ✓');return}
  const {fs,fdb}=FB;const b=fs.writeBatch(fdb);b.update(fs.doc(fdb,'users',uid),{role,roleBy:USER.uid,roleAt:fs.serverTimestamp()});
  const u=USERS.find(x=>x.id===uid);b.set(fs.doc(fs.collection(fdb,'audit')),{action:'role',memberId:uid,name:(u&&u.name)||'',fields:[role],uid:USER.uid,by:USER.name,at:fs.serverTimestamp()});
  try{await b.commit();toast(`${u?u.name:''}: ${ROLE_AR[role]} ✓`)}catch(e){toast(fbErr(e))}
}
async function admAudit(){
  const box=$('#admBody');let rows=[];
  if(window.__DEMO)rows=window.__DEMO_AUDIT||[];else{try{const {fs,fdb}=FB;const s=await fs.getDocs(fs.query(fs.collection(fdb,'audit'),fs.orderBy('at','desc'),fs.limit(80)));rows=s.docs.map(d=>d.data())}catch(e){box.innerHTML=`<p class="awsmall">${fbErr(e)}</p>`;return}}

}
const LIMITS={store:1024*1024*1024,reads:50000,writes:20000};
function estBytes(){let m=0,p=0;MEMBERS.forEach(x=>{const {photo,...r}=x;m+=JSON.stringify(r).length+200;if(photo)p+=photo.length+150});return {m,p,t:m+p}}
function admUsage(){
  const box=$('#admBody');const e=estBytes();const pct=Math.min(100,e.t/LIMITS.store*100);const ph=MEMBERS.filter(m=>m.photo).length;
  const kb=n=>n>1048576?(n/1048576).toFixed(1)+' ميجا':Math.ceil(n/1024)+' كيلو';
  box.innerHTML=`<div class="meter"><div class="mbar"><i style="width:${Math.max(pct,1.5)}%"></i></div><b>${kb(e.t)} من 1024 ميجا مجاناً (${pct.toFixed(2)}%)</b></div>
   <div class="acc"><div class="accr"><span>عدد الأفراد</span><b>${MEMBERS.length}</b></div><div class="accr"><span>أفراد ليهم صورة</span><b>${ph}</b></div><div class="accr"><span>حجم البيانات</span><b>${kb(e.m)}</b></div><div class="accr"><span>حجم الصور</span><b>${kb(e.p)}</b></div><div class="accr"><span>متوسط الصورة</span><b>${ph?kb(e.p/ph):'—'}</b></div></div>
   <p class="awsmall">الخطة المجانية (Firebase Spark) فيها: 1 جيجا تخزين، 50 ألف قراية و20 ألف كتابة كل يوم، من غير أي فلوس ومن غير كارت بنك. التطبيق بيقرا التعديلات الجديدة بس مش الشجرة كلها كل مرة، والصور بتتصغّر لوحدها (حوالي 25 كيلو للصورة)، فـ300 فرد بصورهم مش هيعدّوا 2٪ من الحد.</p>
   <p class="awsmall">لو الخطة المجانية خلصت في يوم، التطبيق بيقف يكتب لحد تاني يوم بس، ومفيش أي فلوس بتتخصم لأن مفيش كارت متسجل.</p>
   ${pct>70?'<p class="warnbox">⚠️ التخزين قرّب يخلص. خد نسخة احتياطية وامسح صور مش محتاجها.</p>':''}`;
}

/* ---------- warn the admin when the free plan is getting full ---------- */
function usageWarn(){if(!isAdmin)return;const p=estBytes().t/LIMITS.store;if(p>0.7)toast('⚠️ مساحة التخزين المجانية قرّبت تخلص — شوف لوحة الأدمن')}

/* ---------- backup: export & restore ---------- */
function openBackup(){
  panel('💾','نسخة احتياطية',`<p class="pmsg">نزّل نسخة كاملة من الشجرة (الأفراد والصور والرسايل) في ملف على موبايلك أو الكمبيوتر. خليها عندك في أمان، ومتبعتهاش لحد مش من العيلة.</p>
    ${isAdmin?`<div class="awlbl" style="margin-top:14px">♻️ استرجاع نسخة (للأدمن بس)</div><p class="awsmall">اختار ملف النسخة. الأفراد اللي في الملف هيرجعوا زي ما هم.</p><label class="btn" for="bkFile">اختار ملف النسخة…</label><input id="bkFile" type="file" accept="application/json,.json" class="fileX"><div id="bkInfo"></div>`:''}`,
    `<button class="btn pri" id="bkOut">⬇️ نزّل نسخة دلوقتي</button><button class="btn" data-p="close">رجوع</button>`);
  $('#bkOut').onclick=exportBackup;
  const f=$('#bkFile');if(f)f.onchange=async e=>{const file=e.target.files[0];if(!file)return;let data;try{data=JSON.parse(await file.text())}catch(err){toast('الملف ده مش نسخة من الشجرة');return}
    if(!data||!Array.isArray(data.members)){toast('الملف ده مش نسخة من الشجرة');return}
    const info=$('#bkInfo');info.innerHTML=`<p class="pmsg">الملف فيه <b>${data.members.length}</b> فرد و<b>${Object.keys(data.photos||{}).length}</b> صورة و<b>${(data.wishes||[]).length}</b> رسالة.</p>
      <label class="chk"><input type="checkbox" id="bkWipe" checked> امسح الأفراد القدام اللي مش موجودين في الملف</label>
      <button class="btn pri" id="bkGo">♻️ استرجع النسخة دي</button>`;
    $('#bkGo').onclick=()=>restoreBackup(data,$('#bkWipe').checked)};
}
async function exportBackup(){
  let wishes=[];const src=new Map(WISH?WISH.map:[]);
  if(FB&&!window.__DEMO){try{const {fs,fdb}=FB;const s=await fs.getDocs(fs.collection(fdb,'wishes'));s.docs.forEach(d=>src.set(d.id,{...d.data(),id:d.id}))}catch(e){}}
  src.forEach(w=>{if(!w.deleted){const {updatedAt,createdAt,...r}=w;wishes.push(r)}});
  const members=MEMBERS.map(({photo,...m})=>{const o={};['id','name','gender','parentIds','spouseId','deceased','birth','death','bday','city','phone','mapUrl','title','nickname','birthPlace','job','education','email','bio'].forEach(k=>{if(m[k]!==undefined&&m[k]!==''&&m[k]!==null)o[k]=m[k]});o.parentIds=m.parentIds||[];o.spouseId=m.spouseId||null;return o});
  const photos={};MEMBERS.forEach(m=>{if(m.photo)photos[m.id]=m.photo});
  const data={app:'family-tree',version:1,exportedAt:new Date().toISOString(),members,photos,wishes,content:CONTENT||{}};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const name=`شجرة-العيلة-${todayISO()}.json`;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&/android|iphone|ipad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('النسخة نزلت ✓');
}
async function restoreBackup(data,wipe){
  if(!isAdmin)return;const go=$('#bkGo');go.disabled=true;
  if(window.__DEMO){for(const m of data.members)await api.save({...m,photo:(data.photos||{})[m.id]||null});toast('اترجعت ✓');pnl.hidden=true;return}
  const {fs,fdb}=FB;const ops=[];const meta=()=>({updatedAt:fs.serverTimestamp(),updatedBy:USER.uid,updatedByName:USER.name});
  const keep=new Set(data.members.map(m=>String(m.id)));
  data.members.forEach(m=>{const {photo,photoRemoved,updatedAt,...r}=m;ops.push(b=>b.set(fs.doc(fdb,'members',String(m.id)),{...r,id:String(m.id),parentIds:(r.parentIds||[]).map(String),spouseId:r.spouseId?String(r.spouseId):null,deceased:!!r.deceased,deleted:false,...meta()}))});
  Object.entries(data.photos||{}).forEach(([id,ph])=>ops.push(b=>b.set(fs.doc(fdb,'photos',String(id)),{data:ph,updatedAt:fs.serverTimestamp(),updatedBy:USER.uid})));
  (data.wishes||[]).forEach(w=>{if(!w.id)return;ops.push(b=>b.set(fs.doc(fdb,'wishes',String(w.id)),{...w,deleted:false,updatedAt:fs.serverTimestamp(),createdAt:fs.serverTimestamp()}))});
  if(data.content&&Object.keys(data.content).length)ops.push(b=>b.set(fs.doc(fdb,'meta','content'),{...data.content,updatedAt:fs.serverTimestamp()}));
  if(wipe)MEMBERS.forEach(m=>{if(!keep.has(m.id))ops.push(b=>b.set(fs.doc(fdb,'members',m.id),{deleted:true,...meta()},{merge:true}))});
  ops.push(b=>b.set(fs.doc(fs.collection(fdb,'audit')),{action:'restore',memberId:'',name:`${data.members.length} فرد`,fields:[],uid:USER.uid,by:USER.name,at:fs.serverTimestamp()}));
  try{for(let i=0;i<ops.length;i+=300){const b=fs.writeBatch(fdb);ops.slice(i,i+300).forEach(f=>f(b));go.textContent=`بيرجّع… ${Math.min(i+300,ops.length)}/${ops.length}`;await b.commit()}
    toast('النسخة اترجعت ✓');setTimeout(()=>location.reload(),900)}catch(e){toast(fbErr(e));go.disabled=false;go.textContent='♻️ استرجع النسخة دي'}
}

/* ---------- الأمنيات والدعوات ---------- */
let WISH=null,WTAB='msgs';
function wishRows(){const out=[];if(WISH)WISH.map.forEach(w=>{if(!w.deleted)out.push(w)});return out.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||tsMs(b.createdAt)-tsMs(a.createdAt))}
function startWishes(){
  if(WISH)return;
  if(window.__DEMO){WISH={map:new Map((window.__DEMO_WISHES||[]).map(w=>[w.id,w]))};return}
  WISH=syncCol('wishes',()=>{if(!pnl.hidden&&pnl.querySelector('.wishsec'))paintWishList()},()=>{});
}
function openWishes(){
  startWishes();
  panel('🤲','الأمنيات والدعوات',`<div class="wishsec"><p class="wintro">هندعي لحد سبقنا ونتمنى لحد معانا</p>
    <div class="seg3">${[['msgs','💌 رسايل العيلة'],['quick','🤲 ادعي واتمنى']].map(([k,l])=>`<button data-wt="${k}" class="${WTAB===k?'on':''}">${l}</button>`).join('')}</div>
    <div id="wBody"></div></div>`,`<button class="btn" data-p="close">رجوع</button>`);
  pnl.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{WTAB=b.dataset.wt;openWishes()});
  WTAB==='quick'?paintQuick():paintWishList();
}
function paintQuick(){
  const box=$('#wBody');const alive=MEMBERS.filter(m=>!isDead(m)),dead=MEMBERS.filter(isDead);
  const A=alive.length?rnd(alive).id:null,D=dead.length?rnd(dead).id:null;
  const W=(CONTENT.wishes&&CONTENT.wishes.length?CONTENT.wishes:DEF_W),Du=(CONTENT.duas&&CONTENT.duas.length?CONTENT.duas:DEF_D);
  const card=(id,txt,cls,lbl)=>`<div class="wcard ${cls}" data-go="${id}"><div class="wlbl">${lbl}</div>${avatar(id)}<p>${esc(fill(txt,id))}</p></div>`;
  box.innerHTML=`<div class="wgrid">${A?card(A,rnd(W),'alive','💐 نتمنّى'):''}${D?card(D,rnd(Du),'dead','🤲 ندعي'):''}</div><div class="wqb"><button class="btn pri" id="wAgain">غيرهم ↻</button></div>`;
  $('#wAgain').onclick=paintQuick;box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{pnl.hidden=true;goTo(b.dataset.go)});
}
function paintWishList(){
  const box=$('#wBody');if(!box||WTAB!=='msgs')return;const rows=wishRows();const today=todayISO();
  const canSee=w=>w.kind!=='future'||!w.openAt||w.openAt<=today||w.uid===(USER&&USER.uid)||isAdmin;
  box.innerHTML=`<button class="btn pri wadd" id="wNew">＋ اكتب دعاء أو أمنية أو رسالة</button>
    ${rows.length?rows.map(w=>{const k=KIND[w.kind]||KIND.msg;const mine=USER&&w.uid===USER.uid;const lock=!canSee(w);
      return `<article class="wmsg k-${w.kind||'msg'}"><header><span class="wk">${k.i} ${k.t}</span>${w.forId&&byId[w.forId]?`<button class="wfor" data-go="${w.forId}">لـ${esc(tName(w.forId))}</button>`:''}</header>
        <p>${lock?`🔒 الرسالة دي هتتفتح يوم ${fmtDate(w.openAt)}`:esc(w.text)}</p>
        <footer><b>${esc(w.from||'')}</b><time>${fmtDate(w.date)}</time>${w.kind==='future'&&w.openAt?`<span class="wopen">تتفتح ${fmtDate(w.openAt)}</span>`:''}${mine||isAdmin?`<button class="wdel" data-del="${w.id}" aria-label="امسح">🗑️</button>`:''}</footer></article>`}).join('')
     :'<p class="awsmall" style="text-align:center;padding:20px 0">لسه محدش كتب حاجة. ابدأ إنت بأول دعوة 🤍</p>'}`;
  $('#wNew').onclick=openWishForm;
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{pnl.hidden=true;goTo(b.dataset.go)});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmBox('مسح الرسالة','متأكد إنك عايز تمسح الرسالة دي؟','امسح',async()=>{await saveWish({id:b.dataset.del,deleted:true});toast('اتمسحت');openWishes()}));
}
function openWishForm(){
  const people=[...MEMBERS].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  panel('💌','اكتب للعيلة',`<form id="wf" class="wform" novalidate>
    <label>النوع<select id="w-kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}">${v.i} ${v.t}</option>`).join('')}</select></label>
    <label>لمين؟ (اختياري)<select id="w-for"><option value="">للعيلة كلها</option>${people.map(m=>`<option value="${m.id}">${esc(m.name)}${ofLine(m.id)?' — '+esc(ofLine(m.id)):''}</option>`).join('')}</select></label>
    <label>الكلام<textarea id="w-text" rows="5" maxlength="2000" placeholder="اكتب دعوة حلوة أو أمنية أو رسالة…"></textarea></label>
    <div class="wrow2"><label>من مين<input id="w-from" value="${esc(USER?USER.name:'')}" maxlength="80"></label><label>التاريخ<input id="w-date" type="date" value="${todayISO()}"></label></div>
    <label id="w-openL" hidden>تتفتح يوم<input id="w-open" type="date"></label>
    <p class="gerr" id="w-err"></p></form>`,
    `<button class="btn pri" id="wSave">حفظ</button><button class="btn" id="wBack">رجوع</button>`);
  $('#w-kind').onchange=()=>{$('#w-openL').hidden=$('#w-kind').value!=='future'};
  $('#wBack').onclick=openWishes;
  $('#wSave').onclick=async()=>{const text=$('#w-text').value.trim();if(!text){$('#w-err').textContent='اكتب الكلام الأول';return}
    const kind=$('#w-kind').value;const openAt=kind==='future'?$('#w-open').value:'';if(kind==='future'&&!openAt){$('#w-err').textContent='اختار يوم الفتح';return}
    $('#wSave').disabled=true;
    await saveWish({id:'w'+Date.now()+Math.random().toString(36).slice(2,6),kind,text,forId:$('#w-for').value||null,from:$('#w-from').value.trim()||(USER&&USER.name)||'',date:$('#w-date').value||todayISO(),openAt:openAt||null,uid:USER&&USER.uid,isNew:true});
    toast('اتحفظت ✓ والعيلة كلها هتشوفها');WTAB='msgs';openWishes()};
}
async function saveWish(w){
  const {isNew,...d}=w;
  if(window.__DEMO){const cur=WISH.map.get(d.id)||{};WISH.map.set(d.id,{...cur,...d});return}
  const {fs,fdb}=FB;const b=fs.writeBatch(fdb);const ref=fs.doc(fdb,'wishes',d.id);
  if(isNew)b.set(ref,{...d,deleted:false,createdAt:fs.serverTimestamp(),updatedAt:fs.serverTimestamp()});else b.set(ref,{...d,updatedAt:fs.serverTimestamp()},{merge:true});
  const cur=WISH.map.get(d.id)||{};WISH.map.set(d.id,{...cur,...d,updatedAt:fs.Timestamp.now(),createdAt:cur.createdAt||fs.Timestamp.now()});
  await commitSoft(b);
}

  fs.onSnapshot(fs.query(fs.collection(fdb,'users'),fs.where('role','==','pending')),s=>{const n=s.size,b=$('#menuBadge');b.hidden=!n;b.textContent=n;if(n&&!window.__pendToast){window.__pendToast=1;toast(`فيه ${n} طلب انضمام مستني موافقتك — دوس على أيقونة الحساب`)}},()=>{})}

  MEMBERS=rows.filter(r=>r&&r.id).map(r=>({...r,id:String(r.id),parentIds:(r.parentIds||[]).map(String),spouseId:r.spouseId?String(r.spouseId):null}));

},err=>{console.error(err);$('#live').classList.add('off');$('#liveTxt').textContent='مش متصل';$('#loading').textContent='مش قادرين نوصل للبيانات. اتأكد من النت وافتح الصفحة تاني.'});
window.__ft={kin,yours,about,byId:()=>byId,openProfile,openForm,openKin,openWishes,openAccount,openAdmin,openBackup,exportBackup,restoreBackup,api,goTo};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
